name: Release

# Builds and publishes a coherent release set on a version tag.
# Requires repository secrets (set in Settings → Secrets):
#   DRUMEE_SSH_KEY     deploy key with read access to the component repos
#   GPG_PRIVATE_KEY    project signing key (armored) + GPG_PASSPHRASE
#   REGISTRY_TOKEN     container registry push token
#   NPM_TOKEN          (optional) token for the private @drumee npm packages —
#                      without it the component installs fail and the image build
#                      stops rather than publishing images with no node_modules
#   APT_SSH_KEY        private key whose public half is authorized for
#   APT_SSH_HOST       USER@HOST of the apt.drumee.net VPS — publishes the flat
#                      APT repo to the nginx doc root (see scripts/deploy-apt-repo.sh)
#   APT_SSH_KNOWN_HOSTS (optional) pinned host key for APT_SSH_HOST; without it
#                      the workflow falls back to ssh-keyscan (trust on first use)
#   PAGES_DEPLOY_TOKEN token with contents:write on drumee/get-drumee-pages —
#                      publishes the get.drumee.com Pages content (installers,
#                      renderer, keyring, CLIs)
#
# The apt and Pages targets are independent: publish-site.sh deploys to whichever
# has credentials and skips the other with a notice.
#
# Several steps are gated on these secrets; without them the workflow no-ops the
# affected job rather than failing, so forks can run the buildable parts.

on:
  push:
    tags: ['v*']
  # Publish images without cutting a release tag. The container channel is unusable
  # until images exist in the registry, and that should not require a version bump.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (e.g. 1.0.0 or preview)'
        required: true
        default: preview
      platforms:
        description: 'Target platforms (add linux/arm64 for Raspberry Pi / ARM boxes)'
        required: true
        default: linux/amd64
        type: choice
        options:
          - linux/amd64
          - linux/amd64,linux/arm64
      push:
        description: 'Push to the registry (off = build only, to validate)'
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  packages: write
  id-token: write   # keyless cosign signing via GitHub OIDC

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versions coherent with manifest
        run: scripts/check-versions.sh
      - name: Metapackage deps pinned to manifest
        run: meta/make-control.sh --check

  images:
    needs: guard
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      BRANCH: preview
      # Tag pushes publish under the tag; a manual run publishes under its input.
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      PLATFORMS: ${{ github.event_name == 'workflow_dispatch' && inputs.platforms || 'linux/amd64' }}
    steps:
      - uses: actions/checkout@v4
      # Emulation for any non-native platform (arm64 here). Harmless when the
      # target is amd64 only, and buildx needs it before the first cross build.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Skip notice
        if: ${{ secrets.DRUMEE_SSH_KEY == '' }}
        run: echo "DRUMEE_SSH_KEY not set — skipping image build/publish."
      - name: Configure source access (SSH deploy key)
        if: ${{ secrets.DRUMEE_SSH_KEY != '' }}
        run: |
          mkdir -p ~/.ssh && echo "${{ secrets.DRUMEE_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Authorize the private npm registry (optional)
        if: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          printf '@drumee:registry=https://registry.npmjs.org/\n' > ~/.npmrc
          printf '//registry.npmjs.org/:_authToken=%s\n' "${{ secrets.NPM_TOKEN }}" >> ~/.npmrc
      - name: Clone component sources
        if: ${{ secrets.DRUMEE_SSH_KEY != '' }}
        run: |
          fail=0
          for r in server-team ui-team schemas setup-schemas static; do
            git clone -b "$BRANCH" "git@github.com:drumee/$r.git" "$HOME/$r" \
              || git clone "git@github.com:drumee/$r.git" "$HOME/$r" || true
            [ -f "$HOME/$r/package.json" ] || continue
            # The images are built with INSTALL_DEPS=0, i.e. they package THIS
            # node_modules. If the install fails the image would ship without its
            # dependencies, so treat it as fatal instead of publishing a broken
            # image (the Dockerfiles also refuse, this just names the cause).
            if ! ( cd "$HOME/$r" && (npm ci || npm install) ); then
              echo "::error::dependency install failed for $r — private @drumee packages need NPM_TOKEN"
              fail=1
            fi
          done
          [ "$fail" = 0 ]
      - name: Registry login
        if: ${{ secrets.REGISTRY_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Build and push all images
        if: ${{ secrets.DRUMEE_SSH_KEY != '' }}
        env:
          PUSH: ${{ (secrets.REGISTRY_TOKEN != '' && (github.event_name != 'workflow_dispatch' || inputs.push)) && '1' || '0' }}
        run: scripts/publish-images.sh
      - name: Install cosign + syft (supply-chain)
        if: ${{ secrets.REGISTRY_TOKEN != '' }}
        uses: sigstore/cosign-installer@v3
      - name: Sign images (keyless, GitHub OIDC) + emit SBOM
        if: ${{ secrets.REGISTRY_TOKEN != '' }}
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          COSIGN_YES: "true"
        run: |
          for n in server-pod ui-build schemas schemas-populate wireguard static infra-init; do
            cosign sign --yes "$REGISTRY/$n:$TAG" || echo "warn: cosign sign $n failed"
          done
      - name: SBOM for server-pod (syft)
        if: ${{ secrets.REGISTRY_TOKEN != '' }}
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/server-pod:${{ env.TAG }}
          format: spdx-json
          artifact-name: sbom-server-pod.spdx.json

  debs:
    needs: guard
    # Only on a real release tag: a manual image publish should not touch apt.
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build toolchain
        run: sudo apt-get update && sudo apt-get install -y dh-make devscripts debhelper build-essential apt-utils
      - name: Import signing key
        if: ${{ secrets.GPG_PRIVATE_KEY != '' }}
        run: echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
      - name: Generate base seed (drumee-schemas needs a mariabackup seed)
        if: ${{ secrets.DRUMEE_SSH_KEY != '' }}
        run: tests/native/make-seed.sh        # -> schemas/var/tmp/drumee/seeds.tgz
      - name: Build packages
        if: ${{ secrets.DRUMEE_SSH_KEY != '' }}
        run: |
          mkdir -p ~/.ssh && echo "${{ secrets.DRUMEE_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519 && ssh-keyscan github.com >> ~/.ssh/known_hosts
          export DEB_BUILD_TARGET="$PWD/out-debs"; mkdir -p "$DEB_BUILD_TARGET"
          ./build-all.sh
          meta/build.sh
      - name: Native install verify (end-to-end, disposable Debian container)
        if: ${{ secrets.DRUMEE_SSH_KEY != '' }}
        run: tests/native/install-verify.sh   # installs the built .debs + checks it serves
      - name: Authorize the apt.drumee.net deploy key
        if: ${{ secrets.APT_SSH_KEY != '' && secrets.APT_SSH_HOST != '' }}
        env:
          APT_SSH_HOST: ${{ secrets.APT_SSH_HOST }}
          APT_SSH_KEY: ${{ secrets.APT_SSH_KEY }}
          APT_SSH_KNOWN_HOSTS: ${{ secrets.APT_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$APT_SSH_KEY" > ~/.ssh/id_apt && chmod 600 ~/.ssh/id_apt
          host="${APT_SSH_HOST##*@}"
          if [ -n "$APT_SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$APT_SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          else
            echo "::warning::APT_SSH_KNOWN_HOSTS not set — trusting $host on first use"
            ssh-keyscan "$host" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          # Pin the key per-host so the github.com deploy key is not offered here.
          printf 'Host %s\n  IdentityFile ~/.ssh/id_apt\n  IdentitiesOnly yes\n' "$host" >> ~/.ssh/config
      - name: Publish install hosts (apt.drumee.net + get.drumee.com Pages)
        if: ${{ secrets.GPG_PRIVATE_KEY != '' && secrets.DRUMEE_SSH_KEY != '' && (secrets.APT_SSH_HOST != '' || secrets.PAGES_DEPLOY_TOKEN != '') }}
        env:
          APT_SSH_HOST: ${{ secrets.APT_SSH_HOST }}
          GH_TOKEN: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: scripts/publish-site.sh --debs=out-debs        # uses the imported default GPG key
      - name: Skip apt publish notice
        if: ${{ secrets.APT_SSH_HOST == '' || secrets.APT_SSH_KEY == '' }}
        run: echo "APT_SSH_HOST/APT_SSH_KEY not set — built .debs but did not publish to apt.drumee.net."
      - name: Skip Pages publish notice
        if: ${{ secrets.PAGES_DEPLOY_TOKEN == '' }}
        run: echo "PAGES_DEPLOY_TOKEN not set — did not publish the get.drumee.com Pages content."
      - name: Upload artifacts
        if: ${{ secrets.DRUMEE_SSH_KEY != '' }}
        uses: actions/upload-artifact@v4
        with: { name: debs, path: out-debs/*.deb, if-no-files-found: ignore }
      - name: Skip notice
        if: ${{ secrets.DRUMEE_SSH_KEY == '' }}
        run: echo "DRUMEE_SSH_KEY not set — skipping .deb build (needs private source)."

  smoke:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Container install smoke test
        run: tests/smoke-container.sh
