# Drumee instance configuration — single source of truth.
#
# Copy to drumee.yaml, edit, then render the deployment artifacts:
#
#   node config/render.mjs all --config config/drumee.yaml --out-dir ./out
#
# Produces:  out/.env  out/docker-compose.yml  out/install.conf
#
# Format contract (keep it simple — the bundled parser supports this subset):
#   * 2-space indentation, exactly two levels (section -> key: value)
#   * scalars: strings, integers, true/false, null (or empty) for "generate/none"
#   * inline lists only:  key: [a, b, c]
#   * '#' starts a comment (not allowed inside an unquoted value)

instance:
  description: My Great Drumee Team
  domain: example.com
  local_mode: false
  admin_email: admin@example.com

network:
  ip4: auto                # 'auto' = detect at install time, or set e.g. 203.0.113.10
  ip6: auto
  services: []

tls:
  mode: acme               # acme | own | self-signed
  acme_email: ssl@example.com
  # own_cert_path: /etc/drumee/ssl   # required only when mode: own

storage:
  data_dir: /data
  db_dir: /srv/db
  backup_location: /srv/backup
  exchange_location: /exchangearea

database:
  host: mariadb            # 'mariadb' for containers, 'localhost' for native
  port: 3306
  name: drumee
  user: drumee-app
  password: null           # null = generate a strong random password

redis:
  host: redis
  port: 6379
  password: null

email:
  host: smtp.example.com
  port: 587
  secure: false
  user: butler
  password: null

optional_services:
  jitsi: false
  prosody: false
  coturn: false

ports:
  api: 24000             # service.js REST listener (--restPort), proxied at /-/*
  ui: 23000              # index.js page + WebSocket listener (--pushPort)

images:
  registry: drumee       # where publish-images.sh pushed, e.g. ghcr.io/drumee

versions:
  server: 2.9.44
  ui: 3.2.49
  schemas: 2.6.99
  static: 1.0.3

plugins:
  # Optional plugins shipped with the instance, loaded for the 'main' endpoint.
  # Each name N maps to image <images.registry>/N:<plugins.tag> (UI: N-ui).
  # Build them with scripts/build-images-local.sh (SERVER_PLUGINS/UI_PLUGINS=...).
  #
  # server: backend plugins. A one-shot plugin-<N> container publishes the plugin
  #   into the shared plugins volume, loads its schemas/{tables,procedures} into
  #   the hub template + entity DBs, and registers it in conf.d/plugins/main.json;
  #   server-pod then loads it via Acl.loadPlugins().  e.g. loby (SSO/onboarding).
  # ui: frontend plugins. A one-shot plugin-ui-<N> container publishes the webpack
  #   bundle the proxy serves at /-/plugins/<N>/; bootstrap.plugin resolves it at
  #   runtime (loaded on demand as #@plugins/<N>).  e.g. signin, signup.
  server: []               # e.g. [loby]
  ui: []                   # e.g. [signin, signup]
  tag: latest
